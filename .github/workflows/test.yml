name: SecOps Ledger CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Environment/requirements.txt

      - name: Run AST Static Validation
        run: |
          python Grader/static_check.py

      - name: Run FastAPI Server
        run: |
          python -m uvicorn Environment.app.server:app --host 127.0.0.1 --port 8000 &
          # Wait for the server to be up and responsive
          for i in {1..10}; do
            curl -s http://127.0.0.1:8000/docs > /dev/null && echo "Server is up!" && break
            echo "Waiting for uvicorn server to start..."
            sleep 1
          done

      - name: Run PyTest Integration Tests
        run: |
          pytest Grader/test_harness.py

  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
